<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open City — Hardwin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
<meta name="description" content="Hardwin Open City — game 3D thế giới mở">
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#0a0e1a;font-family:system-ui,sans-serif;color:#e8eef8}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud{position:absolute;left:12px;top:12px;background:rgba(10,14,28,.75);padding:10px 14px;border-radius:12px;font-size:13px;border:1px solid rgba(148,163,184,.25)}
#minimap{position:absolute;right:12px;top:12px;width:140px;height:140px;border-radius:12px;border:1px solid rgba(148,163,184,.3);background:rgba(10,14,28,.8);overflow:hidden}
#clock{position:absolute;right:12px;bottom:12px;background:rgba(10,14,28,.75);padding:8px 12px;border-radius:10px;font-size:12px;border:1px solid rgba(148,163,184,.25)}
#hint{position:absolute;left:12px;bottom:12px;background:rgba(10,14,28,.75);padding:8px 12px;border-radius:10px;font-size:12px;border:1px solid rgba(148,163,184,.25);max-width:280px}
#brand{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#38bdf8;opacity:.9}
</style>
</head>
<body>
<div id="ui">
<div id="brand">HARDWIN · OPEN CITY</div>
<div id="hud"><div id="mode">🚶 Đi bộ</div><div id="speed">0 km/h</div></div>
<canvas id="minimap" width="140" height="140"></canvas>
<div id="clock"><span id="time">12:00</span> · <span id="stats">0 xe · 0 người</span></div>
<div id="hint">WASD di chuyển · Shift chạy · Space nhảy · F lên xe · Chuột xoay</div>
</div>
<script>
/* Open City demo - will load full version if available */
(function boot(n){
if(typeof THREE==='undefined'){if(n<80)return setTimeout(function(){boot(n+1)},200);return;}
// If full game was truncated, show note - redirect attempt
fetch('/open-city-3d.html').then(function(r){if(r.ok)location.replace('/open-city-3d.html');}).catch(function(){});
var W=innerWidth,H=innerHeight;
var renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
var scene=new THREE.Scene();scene.background=new THREE.Color(0x87b8e0);scene.fog=new THREE.Fog(0x87b8e0,80,280);
var camera=new THREE.PerspectiveCamera(60,W/H,0.1,500);camera.position.set(0,8,16);
var controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.48;
scene.add(new THREE.AmbientLight(0xffffff,0.55));
var sun=new THREE.DirectionalLight(0xfff5e0,0.9);sun.position.set(50,80,30);scene.add(sun);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x3a3a3a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
// roads
for(var i=-4;i<=4;i++){var rx=new THREE.Mesh(new THREE.PlaneGeometry(12,400),new THREE.MeshStandardMaterial({color:0x222222}));rx.rotation.x=-Math.PI/2;rx.position.set(i*40,0.02,0);scene.add(rx);
var rz=new THREE.Mesh(new THREE.PlaneGeometry(400,12),new THREE.MeshStandardMaterial({color:0x222222}));rz.rotation.x=-Math.PI/2;rz.position.set(0,0.02,i*40);scene.add(rz);}
// buildings
function rnd(a,b){return a+Math.random()*(b-a)}
for(var x=-160;x<=160;x+=40){for(var z=-160;z<=160;z+=40){if(Math.abs(x)<20&&Math.abs(z)<20)continue;
var h=rnd(8,35);var b=new THREE.Mesh(new THREE.BoxGeometry(rnd(10,18),h,rnd(10,18)),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(rnd(0.05,0.15),0.15,rnd(0.25,0.45))}));b.position.set(x+rnd(-5,5),h/2,z+rnd(-5,5));scene.add(b);}}
// player capsule proxy
var player=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.2,4,8),new THREE.MeshStandardMaterial({color:0x38bdf8}));player.position.set(0,1.4,0);scene.add(player);
var keys={};window.addEventListener('keydown',function(e){keys[e.code]=true;});window.addEventListener('keyup',function(e){keys[e.code]=false;});
var vel=new THREE.Vector3(),clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);var dt=Math.min(clock.getDelta(),0.05);
var spd=(keys.ShiftLeft||keys.ShiftRight)?18:8;
var f=0,s=0;if(keys.KeyW||keys.ArrowUp)f-=1;if(keys.KeyS||keys.ArrowDown)f+=1;if(keys.KeyA||keys.ArrowLeft)s-=1;if(keys.KeyD||keys.ArrowRight)s+=1;
var dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();
var right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
vel.set(0,0,0);vel.addScaledVector(dir,-f*spd);vel.addScaledVector(right,s*spd);
player.position.addScaledVector(vel,dt);
if(keys.Space)player.position.y=Math.min(3,player.position.y+dt*8);else player.position.y=Math.max(1.4,player.position.y-dt*12);
controls.target.lerp(player.position,0.1);controls.update();
document.getElementById('speed').textContent=Math.round(vel.length()*3.6)+' km/h';
renderer.render(scene,camera);}
animate();
window.addEventListener('resize',function(){W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});
})(0);
</script>
</body>
</html>
